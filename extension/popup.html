<!doctype html>
<meta charset="utf-8" />
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0a0a;
    --surface: #161616;
    --border: #2a2a2a;
    --text: #fafafa;
    --muted: #9a9a9a;
    --accent: #4f46e5;
    --ok: #1f9254;
  }
  * {
    box-sizing: border-box;
  }
  body {
    width: 320px;
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font:
      13px/1.5 system-ui,
      -apple-system,
      sans-serif;
  }
  .head {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 4px;
  }
  .mark {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    background: url("icon128.png") center / contain no-repeat;
    display: grid;
    place-items: center;
  }
  h1 {
    font-size: 14px;
    margin: 0;
    font-weight: 600;
  }
  p.sub {
    color: var(--muted);
    margin: 0 0 14px;
    font-size: 12px;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 12px;
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 999px;
    background: var(--muted);
    flex: none;
  }
  .dot.on {
    background: var(--ok);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent);
  }
  .status .lines {
    min-width: 0;
  }
  .status .title {
    font-weight: 600;
  }
  .status .meta {
    color: var(--muted);
    font-size: 11px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  label {
    display: block;
    font-size: 11px;
    color: var(--muted);
    margin: 0 0 4px;
  }
  input {
    width: 100%;
    padding: 8px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font: inherit;
    margin-bottom: 10px;
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .row {
    display: flex;
    gap: 8px;
  }
  button {
    flex: 1;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    font:
      600 13px system-ui,
      sans-serif;
    cursor: pointer;
  }
  button:hover {
    border-color: #3a3a3a;
  }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button.primary:hover {
    filter: brightness(1.08);
  }
  details {
    margin-top: 12px;
  }
  summary {
    color: var(--muted);
    font-size: 11px;
    cursor: pointer;
  }
  details .body {
    padding-top: 10px;
  }
  .saved {
    color: var(--ok);
    font-size: 11px;
    margin: 2px 0 8px;
    min-height: 14px;
  }
  .foot {
    color: var(--muted);
    font-size: 11px;
    margin: 12px 0 0;
    line-height: 1.5;
  }
</style>
<div class="head">
  <span class="mark"></span>
  <h1>Browser Bridge</h1>
</div>
<p class="sub">Shares one tab with your Miniomni agent, so it works with your own sign-ins.</p>

<div class="status">
  <span class="dot" id="dot"></span>
  <div class="lines">
    <div class="title" id="state">Not connected</div>
    <div class="meta" id="detail">Set up below, then share a tab</div>
  </div>
</div>

<div class="row">
  <button class="primary" id="share">Share this tab</button>
  <button id="stop">Stop sharing</button>
</div>

<details id="settings">
  <summary>Miniomni connection</summary>
  <div class="body">
    <label>Miniomni address</label>
    <input id="origin" placeholder="https://miniomni.example.com" autocomplete="off" />
    <label>Pairing token</label>
    <input id="token" type="password" placeholder="paste from Miniomni → Keychain" autocomplete="off" />
    <div class="saved" id="saved"></div>
    <button id="save">Save</button>
  </div>
</details>

<p class="foot">
  While a tab is shared your agent can read and act on it as you — only that tab, nothing else in this browser.
</p>
<script src="popup.js"></script>
