<!doctype html>
<meta charset="utf-8" />
<style>
  body {
    font:
      13px/1.45 system-ui,
      sans-serif;
    width: 300px;
    margin: 0;
    padding: 14px;
  }
  h1 {
    font-size: 14px;
    margin: 0 0 2px;
  }
  p {
    color: #666;
    margin: 0 0 10px;
  }
  label {
    display: block;
    margin-bottom: 8px;
  }
  input {
    width: 100%;
    box-sizing: border-box;
    padding: 6px;
    font: inherit;
  }
  button {
    font: inherit;
    padding: 6px 10px;
    margin-right: 6px;
  }
  .state {
    margin-top: 10px;
    padding: 8px;
    background: #f5f5f5;
    border-radius: 6px;
  }
  .on {
    color: #1f7a47;
    font-weight: 600;
  }
  .off {
    color: #666;
  }
</style>
<h1>QM Browser Bridge</h1>
<p>Shares one tab with your QM agent, so it works with your own sign-ins.</p>
<label>QM address <input id="origin" placeholder="https://qm.example.com" /></label>
<label>Pairing token <input id="token" type="password" placeholder="paste from QM → Keychain" /></label>
<button id="save">Save</button>
<div class="state">
  <div id="conn" class="off">Not connected</div>
  <div id="tab" class="off">No tab shared</div>
</div>
<p style="margin-top: 10px"><button id="share">Share this tab</button><button id="stop">Stop sharing</button></p>
<p style="font-size: 11px">
  While a tab is shared your agent can read and act on it as you. Only that tab — nothing else in this browser.
</p>
<script src="popup.js"></script>
