# QM on Dokploy — single-host Docker target.
#
# Mirrors the wiring the `qm` CLI's docker backend applies
# (cli/src/backends/docker.ts, cli/src/services.ts): core plus the four surface
# plugins on a private network, Postgres for durable state, and the portal as
# the only Internet-facing service. Traefik reaches the portal over Dokploy's
# shared overlay; nothing else joins it.
#
# Every secret and the public URL come from the Dokploy application env — this
# file holds no credentials. See ./README.md for the required keys.

services:
  pg:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: qm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qm"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [qm]

  core:
    build:
      context: ../..
      dockerfile: deploy/dokploy/core.Dockerfile
    # Pinned because CORE_CONTAINER below must name this
    # container; keep the two in step.
    container_name: qm-omniloy-core
    restart: unless-stopped
    depends_on:
      pg:
        condition: service_healthy
    environment:
      PORT: "8080"
      # Deliberately the same value as the bind's host side below — core hands
      # DATA_DIR paths to the host daemon, so the two must be one path, not two.
      DATA_DIR: ${DATA_HOST_DIR}
      ORG_ID: ${ORG_ID}
      HARNESS: ${HARNESS}
      HARNESS_SECURITY_POSTURE: ${HARNESS_SECURITY_POSTURE}
      MODEL_PROVIDER: anthropic
      SESSION_STORE: postgres
      RUN_STORE: postgres
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@pg:5432/qm
      # publicUrl is the portal origin; the portal proxies core's public API,
      # which is what agent sandboxes call back on.
      PUBLIC_WEB_URL: ${PUBLIC_URL}
      WEB_UI_PUBLIC_URL: ${PUBLIC_URL}
      PUBLIC_API_URL: ${PUBLIC_URL}
      # Agent computers are containers on this host's Docker daemon.
      SANDBOX_BACKEND: local
      LOCAL_SANDBOX_IMAGE: ${LOCAL_SANDBOX_IMAGE}
      # Without these two, `docker run` gets no --cpus and no --memory and an
      # agent computer is unbounded on a box that also runs core, Postgres and
      # Traefik. One runaway loop then takes QM down with it. Sized to leave
      # room for several concurrent sandboxes.
      # 3 GB rather than 2: a real browsing session was measured at 1,253 MB
      # across 14 processes, which leaves almost nothing for the agent's own
      # work under a 2 GB cap. The cap still matters — it is what stops a
      # runaway browser from reaching the other services on this host.
      LOCAL_SANDBOX_CPUS: ${LOCAL_SANDBOX_CPUS:-2}
      LOCAL_SANDBOX_MEMORY_MB: ${LOCAL_SANDBOX_MEMORY_MB:-3072}
      # Sandboxes and deployed apps publish on the *host's* loopback, which only
      # a core running on the host could dial. Naming core here makes it join
      # their networks and address them by container name instead.
      CORE_CONTAINER: qm-omniloy-core
      # The one source of admin identity: `<principal>:org_admin`, comma
      # separated. With OIDC_PRINCIPAL_CLAIM=email the principal is the
      # lowercased email. Seeded only while admin_grants is empty — after that
      # the roster is durable and changes go through /admin.
      ADMIN_GRANTS: ${ADMIN_GRANTS}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CORE_SIGNING_SECRET: ${CORE_SIGNING_SECRET}
      CAPABILITY_SECRET: ${CAPABILITY_SECRET}
      PORTAL_IDENTITY_SECRET: ${PORTAL_IDENTITY_SECRET}
      CONNECTOR_SECRET_KEY: ${CONNECTOR_SECRET_KEY}
      SKILL_SIGNING_SECRET: ${SKILL_SIGNING_SECRET}
    volumes:
      # A host bind at the identical path on both sides, NOT a named volume.
      # Core hands DATA_DIR paths (a deployed app's snapshot dir) to the host
      # daemon as bind sources, so they must mean the same thing to both —
      # otherwise the daemon creates an empty dir and the app starts with
      # nothing in /app. Mapping it to a different container path reintroduces
      # exactly that bug, so both sides read from one variable.
      - ${DATA_HOST_DIR}:${DATA_HOST_DIR}
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [qm]

  # Holds a container open on the agent sandbox image so `docker system prune
  # --all` cannot reclaim it. Dokploy's nightly cleanup deleted it once, and
  # every agent exec then failed with "sandbox image not found" until it was
  # rebuilt by hand. Costs one sleeping process.
  sandbox-keepalive:
    image: ${LOCAL_SANDBOX_IMAGE}
    restart: unless-stopped
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    network_mode: none
    read_only: true
    mem_limit: 32m

  auth:
    build:
      context: ../..
      dockerfile: deploy/auth/Dockerfile
    restart: unless-stopped
    depends_on: [core]
    environment:
      PORT: "8080"
      CORE_API_URL: http://core:8080
      CORE_ORG_ID: ${ORG_ID}
      AUTH_ISSUER: ${PUBLIC_URL}/idp
      AUTH_CLIENT_ID: qm-portal
      AUTH_REDIRECT_URI: ${PUBLIC_URL}/auth/callback
      AUTH_BRAND_NAME: ${AUTH_BRAND_NAME}
      AUTH_EMAIL_TRANSPORT: resend
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM}
      AUTH_ALLOWED_EMAIL_DOMAIN: ${AUTH_ALLOWED_EMAIL_DOMAIN}
      RESEND_API_KEY: ${RESEND_API_KEY}
      AUTH_SIGNING_JWK: ${AUTH_SIGNING_JWK}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
      AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET}
      CORE_SIGNING_SECRET: ${CORE_SIGNING_SECRET}
      # Not in the CLI's secret table for auth, but the shared chassis signs
      # portal identity with it and otherwise falls back to CORE_SIGNING_SECRET
      # — which would not match what core verifies.
      PORTAL_IDENTITY_SECRET: ${PORTAL_IDENTITY_SECRET}
    networks:
      qm:
        # The portal refuses to address the broker over a name that could be
        # public (plugins/portal/src/index.ts:isPrivateNetworkUrl). Compose's
        # bare service name is not on its allowlist, so publish the broker
        # under an unroutable `.internal` alias as well.
        aliases: [auth.internal]

  web-ui:
    build:
      context: ../..
      dockerfile: deploy/web-ui/Dockerfile
    restart: unless-stopped
    depends_on: [core]
    environment:
      PORT: "8080"
      CORE_API_URL: http://core:8080
      CORE_ORG_ID: ${ORG_ID}
      WEB_UI_PUBLIC_URL: ${PUBLIC_URL}
      CORE_SIGNING_SECRET: ${CORE_SIGNING_SECRET}
      PORTAL_IDENTITY_SECRET: ${PORTAL_IDENTITY_SECRET}
    networks: [qm]

  admin:
    build:
      context: ../..
      dockerfile: deploy/admin/Dockerfile
    restart: unless-stopped
    depends_on: [core]
    environment:
      PORT: "8080"
      CORE_API_URL: http://core:8080
      CORE_ORG_ID: ${ORG_ID}
      ADMIN_BASE_PATH: /admin
      CORE_SIGNING_SECRET: ${CORE_SIGNING_SECRET}
      PORTAL_IDENTITY_SECRET: ${PORTAL_IDENTITY_SECRET}
    networks: [qm]

  portal:
    build:
      context: ../..
      dockerfile: deploy/portal/Dockerfile
    restart: unless-stopped
    depends_on: [core, auth, web-ui, admin]
    environment:
      PORT: "8080"
      CORE_API_URL: http://core:8080
      CORE_ORG_ID: ${ORG_ID}
      PORTAL_PUBLIC_URL: ${PUBLIC_URL}
      WEB_UI_UPSTREAM: http://web-ui:8080
      ADMIN_UPSTREAM: http://admin:8080
      # Built-in sign-in broker. Browser-facing routes are republished under
      # /idp on the portal's own origin; token/userinfo/JWKS stay private.
      # These three must share one origin with AUTH_BROKER_UPSTREAM, and that
      # origin must be unroutable — see the alias on the auth service.
      AUTH_BROKER_UPSTREAM: http://auth.internal:8080
      AUTH_BROKER_PREFIX: /idp
      OIDC_CLIENT_ID: qm-portal
      OIDC_ISSUER: ${PUBLIC_URL}/idp
      OIDC_AUTH_ENDPOINT: ${PUBLIC_URL}/idp/authorize
      OIDC_TOKEN_ENDPOINT: http://auth.internal:8080/token
      OIDC_USERINFO_ENDPOINT: http://auth.internal:8080/userinfo
      OIDC_JWKS_URI: http://auth.internal:8080/.well-known/jwks.json
      OIDC_SCOPES: openid email
      OIDC_PRINCIPAL_CLAIM: email
      OIDC_ALLOWED_EMAIL_DOMAIN: ${AUTH_ALLOWED_EMAIL_DOMAIN}
      # The portal reads the broker client credential under its OIDC name
      # (cli/src/secrets.ts maps AUTH_CLIENT_SECRET -> OIDC_CLIENT_SECRET).
      OIDC_CLIENT_SECRET: ${AUTH_CLIENT_SECRET}
      # Without this the portal 404s /d/* itself and core never sees the
      # request, so every app the agent publishes looks like it does not exist.
      PORTAL_DEPLOYMENTS_ENABLED: "1"
      PORTAL_SESSION_SECRET: ${PORTAL_SESSION_SECRET}
      PORTAL_IDENTITY_SECRET: ${PORTAL_IDENTITY_SECRET}
      CORE_SIGNING_SECRET: ${CORE_SIGNING_SECRET}
    networks: [qm, dokploy-network]
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.qm-portal.rule=Host(`${PUBLIC_HOST}`)
      - traefik.http.routers.qm-portal.entrypoints=websecure
      - traefik.http.routers.qm-portal.tls.certresolver=letsencrypt
      - traefik.http.services.qm-portal.loadbalancer.server.port=8080

volumes:
  pgdata:

networks:
  qm:
    driver: bridge
  dokploy-network:
    external: true
