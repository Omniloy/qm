services:
  pg:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: qm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qm"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [qm]

  core:
    build:
      context: ../..
      dockerfile: deploy/core/Dockerfile
    container_name: qm-omniloy-core
    restart: unless-stopped
    depends_on:
      pg:
        condition: service_healthy
    group_add:
      - "${DOCKER_GID:-998}"
    env_file:
      - ../layers/omniloy/branding.conf
    environment:
      PORT: "8080"
      DATA_DIR: ${DATA_HOST_DIR}
      ORG_ID: ${ORG_ID}
      HARNESS: ${HARNESS}
      HARNESS_SECURITY_POSTURE: ${HARNESS_SECURITY_POSTURE}
      MODEL_PROVIDER: anthropic
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_API_KEY: ${CODEX_PROXY_API_KEY}
      CODEX_PROXY_URL: ${CODEX_PROXY_URL}
      CODEX_PROXY_MANAGEMENT_KEY: ${CODEX_PROXY_MANAGEMENT_KEY}
      SESSION_STORE: postgres
      RUN_STORE: postgres
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@pg:5432/qm
      PUBLIC_WEB_URL: ${PUBLIC_URL}
      WEB_UI_PUBLIC_URL: ${PUBLIC_URL}
      PUBLIC_API_URL: ${PUBLIC_URL}
      SANDBOX_BACKEND: local
      DOCKER_HOST: unix:///var/run/docker.sock
      LOCAL_SANDBOX_IMAGE: ${LOCAL_SANDBOX_IMAGE}
      LOCAL_SANDBOX_NETWORK_POOL: ${LOCAL_SANDBOX_NETWORK_POOL:-}
      LOCAL_SANDBOX_CPUS: ${LOCAL_SANDBOX_CPUS:-2}
      LOCAL_SANDBOX_MEMORY_MB: ${LOCAL_SANDBOX_MEMORY_MB:-3072}
      QM_CORE_CONTAINER: qm-omniloy-core
      SWARMS_ENABLED: ${SWARMS_ENABLED:-false}
      EAGER_PROVISION: ${EAGER_PROVISION:-false}
      SUGGESTED_ACTIVITIES_ENABLED: ${SUGGESTED_ACTIVITIES_ENABLED:-false}
      SECURITY_SCREEN_BACKEND: ${SECURITY_SCREEN_BACKEND:-model}
      ADMIN_GRANTS: ${ADMIN_GRANTS}
      AUTH_ALLOWED_EMAIL_DOMAIN: ${AUTH_ALLOWED_EMAIL_DOMAIN}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      RELAY_PUBLIC_URL: ${RELAY_PUBLIC_URL:-}
      CORE_SIGNING_SECRET: ${CORE_SIGNING_SECRET}
      CAPABILITY_SECRET: ${CAPABILITY_SECRET}
      PORTAL_IDENTITY_SECRET: ${PORTAL_IDENTITY_SECRET}
      CONNECTOR_SECRET_KEY: ${CONNECTOR_SECRET_KEY}
      SKILL_SIGNING_SECRET: ${SKILL_SIGNING_SECRET}
    volumes:
      - ${DATA_HOST_DIR}:${DATA_HOST_DIR}
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [qm, dokploy-network]
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.qm-relay.rule=Host(`${RELAY_HOST}`) && PathPrefix(`/v1/browser-relay`)
      - traefik.http.routers.qm-relay.entrypoints=websecure
      - traefik.http.routers.qm-relay.tls.certresolver=letsencrypt
      - traefik.http.routers.qm-relay.priority=100
      - traefik.http.services.qm-relay.loadbalancer.server.port=8080

  sandbox-keepalive:
    image: ${LOCAL_SANDBOX_IMAGE}
    restart: unless-stopped
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    network_mode: none
    read_only: true
    mem_limit: 32m

  codex-proxy:
    image: eceasy/cli-proxy-api@sha256:52282964dca47d4978aaffd7dd72d6ed5fb5e5b72acfcbcd1785cfb087d6bd8e
    restart: unless-stopped
    environment:
      CODEX_PROXY_API_KEY: ${CODEX_PROXY_API_KEY}
      CODEX_PROXY_MANAGEMENT_KEY: ${CODEX_PROXY_MANAGEMENT_KEY}
    entrypoint:
      - sh
      - -c
      - |
        set -e
        cat > /CLIProxyAPI/config.yaml <<EOF
        host: "0.0.0.0"
        port: 8317
        auth-dir: "/root/.cli-proxy-api"
        api-keys:
          - "$$CODEX_PROXY_API_KEY"
        remote-management:
          allow-remote: true
          secret-key: "$$CODEX_PROXY_MANAGEMENT_KEY"
          disable-control-panel: true
        logging-to-file: false
        usage-statistics-enabled: false
        debug: false
        EOF
        exec ./CLIProxyAPI
    volumes:
      - codexproxyauth:/root/.cli-proxy-api
    networks: [qm]
    mem_limit: 512m

  web-ui:
    build:
      context: ../..
      dockerfile: deploy/web-ui/Dockerfile
    restart: unless-stopped
    depends_on: [core]
    environment:
      PORT: "8080"
      CORE_API_URL: http://core:8080
      CORE_ORG_ID: ${ORG_ID}
      WEB_UI_PUBLIC_URL: ${PUBLIC_URL}
      ADMIN_ENABLED: "1"
      ADMIN_BASE_PATH: /admin
      CORE_SIGNING_SECRET: ${CORE_SIGNING_SECRET}
      PORTAL_IDENTITY_SECRET: ${PORTAL_IDENTITY_SECRET}
      WEB_UI_FAVICON_SVG_FILE: /etc/qm/brand/logo.svg
    volumes:
      - ../layers/omniloy/logo.svg:/etc/qm/brand/logo.svg:ro
    networks: [qm]

  portal:
    build:
      context: ../..
      dockerfile: deploy/portal/Dockerfile
    restart: unless-stopped
    depends_on: [core, web-ui]
    env_file:
      - ../layers/omniloy/branding.conf
    environment:
      PORT: "8080"
      CORE_API_URL: http://core:8080
      CORE_ORG_ID: ${ORG_ID}
      PORTAL_PUBLIC_URL: ${PUBLIC_URL}
      WEB_UI_UPSTREAM: http://web-ui:8080
      ADMIN_UPSTREAM: http://web-ui:8080/admin
      AUTH_EMBEDDED: "1"
      AUTH_BROKER_UPSTREAM: http://127.0.0.1:8099
      AUTH_BROKER_PREFIX: /idp
      AUTH_ISSUER: ${PUBLIC_URL}/idp
      AUTH_CLIENT_ID: qm-portal
      AUTH_REDIRECT_URI: ${PUBLIC_URL}/auth/callback
      AUTH_EMAIL_TRANSPORT: resend
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM}
      AUTH_ALLOWED_EMAIL_DOMAIN: ${AUTH_ALLOWED_EMAIL_DOMAIN}
      RESEND_API_KEY: ${RESEND_API_KEY}
      AUTH_SIGNING_JWK: ${AUTH_SIGNING_JWK}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
      AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET}
      OIDC_CLIENT_ID: qm-portal
      OIDC_CLIENT_SECRET: ${AUTH_CLIENT_SECRET}
      OIDC_ISSUER: ${PUBLIC_URL}/idp
      OIDC_AUTH_ENDPOINT: ${PUBLIC_URL}/idp/authorize
      OIDC_TOKEN_ENDPOINT: http://127.0.0.1:8099/token
      OIDC_USERINFO_ENDPOINT: http://127.0.0.1:8099/userinfo
      OIDC_JWKS_URI: http://127.0.0.1:8099/.well-known/jwks.json
      OIDC_SCOPES: openid email
      OIDC_PRINCIPAL_CLAIM: email
      OIDC_ALLOWED_EMAIL_DOMAIN: ${AUTH_ALLOWED_EMAIL_DOMAIN}
      PORTAL_DEPLOYMENTS_ENABLED: "1"
      PORTAL_XFF_TRUSTED_HOPS: "1"
      PORTAL_SESSION_SECRET: ${PORTAL_SESSION_SECRET}
      PORTAL_IDENTITY_SECRET: ${PORTAL_IDENTITY_SECRET}
      CORE_SIGNING_SECRET: ${CORE_SIGNING_SECRET}
      PORTAL_FAVICON_SVG_FILE: /etc/qm/brand/logo.svg
      AUTH_FAVICON_SVG_FILE: /etc/qm/brand/logo.svg
    volumes:
      - ../layers/omniloy/logo.svg:/etc/qm/brand/logo.svg:ro
    networks: [qm, dokploy-network]
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.qm-portal.rule=Host(`${PUBLIC_HOST}`)
      - traefik.http.routers.qm-portal.entrypoints=websecure
      - traefik.http.routers.qm-portal.tls.certresolver=letsencrypt
      - traefik.http.services.qm-portal.loadbalancer.server.port=8080

volumes:
  pgdata:
  codexproxyauth:

networks:
  qm:
    driver: bridge
  dokploy-network:
    external: true
